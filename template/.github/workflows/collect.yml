name: Collect Reponomics Data

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reponomics-collect-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIVACY_MODE: "strong"
  RETENTION_DAYS: "90"
  GENERATE_HTML_DASHBOARD: "false"
  GENERATE_README: "false"
  USE_GITHUB_APP: "false"
  REPONOMICS_ACTION_REPOSITORY: "reponomics/reponomics-dashboard-action"
  REPONOMICS_ACTION_REF: "v0.20.3"
  REPONOMICS_ACTION_SHA: "dfa65dac00aa04e4628bfbe50c221413ab47b8fd"

jobs:
  docs-sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: reponomics-docs-sync-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve Reponomics configuration
        run: python .github/scripts/resolve-reponomics-config.py --require-setup

      - name: Sync managed Reponomics docs
        if: env.REPONOMICS_SETUP_COMPLETE == 'true'
        uses: reponomics/reponomics-dashboard-action@v0.20.3
        with:
          mode: docs-sync
          github-token: ${{ github.token }}

  collect:
    needs: docs-sync
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Resolve Reponomics configuration
        run: python .github/scripts/resolve-reponomics-config.py --require-setup

      - name: Refuse incomplete key rotation
        if: env.REPONOMICS_SETUP_COMPLETE == 'true'
        env:
          DASHBOARD_NEXT_SECRET: ${{ secrets.DASHBOARD_NEXT_SECRET }}
        run: |
          set -euo pipefail

          if [ -n "${DASHBOARD_NEXT_SECRET:-}" ]; then
            {
              echo "## Collection stopped"
              echo
              echo "\`DASHBOARD_NEXT_SECRET\` is still set."
              echo "Finish key rotation by replacing \`DASHBOARD_SECRET_DO_NOT_REPLACE\`"
              echo "with the new key, then delete \`DASHBOARD_NEXT_SECRET\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Mint GitHub App installation token (advanced)
        id: collection_app_token
        if: ${{ env.REPONOMICS_SETUP_COMPLETE == 'true' && env.USE_GITHUB_APP == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.COLLECTION_APP_ID || secrets.COLLECTION_APP_ID }}
          private-key: ${{ secrets.COLLECTION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Resolve collection token
        id: resolve_collection_token
        if: env.REPONOMICS_SETUP_COMPLETE == 'true'
        env:
          USE_GITHUB_APP: ${{ env.USE_GITHUB_APP }}
          COLLECTION_TOKEN: ${{ secrets.COLLECTION_TOKEN }}
          APP_COLLECTION_TOKEN: ${{ steps.collection_app_token.outputs.token }}
        run: |
          set -euo pipefail

          if [ "$USE_GITHUB_APP" = "true" ]; then
            if [ -z "${APP_COLLECTION_TOKEN:-}" ]; then
              {
                echo "## Collection stopped"
                echo
                echo "Advanced GitHub App collection mode is enabled, but no installation token was minted."
                echo "Set \`vars.COLLECTION_APP_ID\` and \`secrets.COLLECTION_APP_PRIVATE_KEY\`,"
                echo "then run collection again."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "collection_token=$APP_COLLECTION_TOKEN" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${COLLECTION_TOKEN:-}" ]; then
            {
              echo "## Collection stopped"
              echo
              echo "Missing \`COLLECTION_TOKEN\` secret for PAT-based collection mode."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "collection_token=$COLLECTION_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Collect retained dashboard data
        if: env.REPONOMICS_SETUP_COMPLETE == 'true'
        uses: reponomics/reponomics-dashboard-action@v0.20.3
        with:
          mode: collect
          collection-token: ${{ steps.resolve_collection_token.outputs.collection_token }}
          use-github-app: ${{ env.USE_GITHUB_APP }}
          github-token: ${{ github.token }}
          dashboard-secret: ${{ secrets.DASHBOARD_SECRET_DO_NOT_REPLACE }}
          privacy-mode: ${{ env.PRIVACY_MODE }}
          retention-days: ${{ env.RETENTION_DAYS }}

      - name: Write collect provenance for publish
        if: env.REPONOMICS_SETUP_COMPLETE == 'true'
        run: |
          set -euo pipefail

          mkdir -p reponomics-collect-provenance
          SOURCE_SHA="$(git rev-parse HEAD)"
          export SOURCE_SHA

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "source_repository": os.environ["GITHUB_REPOSITORY"],
              "source_sha": os.environ["SOURCE_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "action_repository": os.environ["REPONOMICS_ACTION_REPOSITORY"],
              "action_ref": os.environ["REPONOMICS_ACTION_REF"],
              "action_sha": os.environ["REPONOMICS_ACTION_SHA"],
              "privacy_mode": os.environ["PRIVACY_MODE"],
              "retention_days": os.environ["RETENTION_DAYS"],
              "generate_html_dashboard": os.environ["GENERATE_HTML_DASHBOARD"],
              "generate_readme": os.environ["GENERATE_README"],
          }
          Path("reponomics-collect-provenance/collect-provenance.json").write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload collect provenance for publish
        if: env.REPONOMICS_SETUP_COMPLETE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reponomics-collect-provenance
          path: reponomics-collect-provenance/collect-provenance.json
          retention-days: ${{ env.RETENTION_DAYS }}
          overwrite: true
