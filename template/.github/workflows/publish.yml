name: Publish Reponomics dashboard

on:
  workflow_run:
    workflows: ["Collect Reponomics Data"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: reponomics-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIVACY_MODE: "strong"
  RETENTION_DAYS: "90"
  GENERATE_README: "false"

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Publish dashboard outputs
        uses: reponomics/reponomics-dashboard-action@v0.15.0
        with:
          mode: publish
          github-token: ${{ github.token }}
          dashboard-secret: ${{ secrets.DASHBOARD_SECRET_DO_NOT_REPLACE }}
          privacy-mode: ${{ env.PRIVACY_MODE }}
          retention-days: ${{ env.RETENTION_DAYS }}
          generate-readme: ${{ env.GENERATE_README }}
