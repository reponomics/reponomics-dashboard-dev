# Reponomics configuration reference
#
# Copy only the settings you want to change into config.yaml. This file is a
# product-owned example; config.yaml is user-owned.
#
# Compatible action releases may add new optional keys here. If your config.yaml
# does not mention an optional key, the runtime uses its documented default.

# Repository selection -------------------------------------------------------

# Maximum number of repositories to track.
max_repos: 50

# If non-empty, track exactly these repositories and ignore all other selection
# settings.
include_only:
  # - owner/repo-name

# Repositories that must always be tracked when accessible.
include:
  # - owner/important-repo

# Repositories that must never be tracked automatically.
exclude:
  # - owner/noisy-repo

# Fill remaining slots with other eligible repositories.
include_others: true

# Allow repositories created after the initial automatic-selection baseline to
# enter the automatic pool.
include_new: false

# Allow private repositories in the automatic pool when TRAFFIC_TOKEN can see
# them.
include_private: true

# Data families --------------------------------------------------------------
#
# Missing keys use runtime defaults. Explicit keys in config.yaml are treated as
# user choices and should not be rewritten by normal collect/publish runs.

data_families:
  # Required v1 traffic history.
  traffic: true

  # Rolling top referrer snapshots.
  referrers: true

  # Rolling popular path snapshots.
  paths: true

  # Aggregate repository growth counters such as stars, subscribers/watchers,
  # and forks. This is repo-level data, not individual account tracking.
  repo_growth: true

  # Future private-audience analytics mode. Disabled by default and expected to
  # require encrypted artifacts plus encrypted or local-only rendering if ever
  # implemented.
  audience_insights: false

