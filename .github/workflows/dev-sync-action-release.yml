name: DEV / Sync Action Release

on:
  repository_dispatch:
    types: [reponomics-dashboard-action-released]
  workflow_dispatch:
    inputs:
      tag:
        description: "Action release tag to sync"
        required: true
        type: string
      target_commitish:
        description: "Expected action release target SHA"
        required: true
        type: string
      release_url:
        description: "Expected action release URL"
        required: true
        type: string

permissions: {}

concurrency:
  group: action-release-sync-${{ github.event.client_payload.tag || inputs.tag }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"

jobs:
  sync-action-release:
    name: Open dashboard-dev action release PR
    runs-on: ubuntu-24.04
    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout dashboard-dev
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Read release payload
        id: payload
        env:
          WORKFLOW_TAG: ${{ inputs.tag }}
          WORKFLOW_TARGET: ${{ inputs.target_commitish }}
          WORKFLOW_RELEASE_URL: ${{ inputs.release_url }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              payload = {
                  "tag": os.environ["WORKFLOW_TAG"],
                  "target_commitish": os.environ["WORKFLOW_TARGET"],
                  "release_url": os.environ["WORKFLOW_RELEASE_URL"],
              }
          else:
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as handle:
                  payload = json.load(handle).get("client_payload", {})

          for key in ("tag", "target_commitish", "release_url"):
              value = str(payload.get(key) or "").strip()
              if not value:
                  raise SystemExit(f"Missing release payload field: {key}")
              print(f"{key}={value}")
          PY

      - name: Install maintainer dependencies
        run: make install

      - name: Sync action release references
        run: |
          set -euo pipefail
          venv/bin/python scripts/sync_action_release.py sync \
            --tag "${{ steps.payload.outputs.tag }}" \
            --expected-target-commitish "${{ steps.payload.outputs.target_commitish }}" \
            --expected-release-url "${{ steps.payload.outputs.release_url }}"

      - name: Verify synced action release
        run: make verify-action-release

      - name: Open or update release sync PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ACTION_TAG: ${{ steps.payload.outputs.tag }}
        run: |
          set -euo pipefail
          branch="automation/reponomics-dashboard-action-${ACTION_TAG}"
          title="deps(action): bump reponomics-dashboard-action to ${ACTION_TAG}"
          remote_ref="refs/heads/${branch}"

          git config user.name "reponomics-dashboard[bot]"
          git config user.email "286571062+reponomics-dashboard[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A

          if git diff --cached --quiet; then
            echo "No action release sync changes to publish."
            exit 0
          fi

          git commit -m "$title"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch --depth=1 origin "${remote_ref}:refs/remotes/origin/${branch}"
            expected="$(git rev-parse "refs/remotes/origin/${branch}")"
            git push --force-with-lease="${remote_ref}:${expected}" origin "HEAD:${remote_ref}"
          else
            git push origin "HEAD:${remote_ref}"
          fi

          body_file="$(mktemp)"
          {
            echo "Updates dashboard-dev to the accepted ${ACTION_TAG} release of reponomics-dashboard-action."
            echo
            echo "Generated by the action release sync workflow after validating the release payload against GitHub."
            echo
            echo "Validation:"
            echo "- make verify-action-release"
          } > "$body_file"

          if gh pr view "$branch" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit "$branch" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body_file"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "$title" --body-file "$body_file"
          fi
