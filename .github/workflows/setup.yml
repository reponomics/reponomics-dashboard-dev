name: Set up Reponomics dashboard

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      privacy_mode:
        description: "Privacy mode"
        type: choice
        required: true
        default: strong
        options:
          # Encrypted artifacts and hosted dashboard; requires a generated high-entropy key.
          - strong
          # Encrypted artifacts and hosted dashboard; accepts any non-empty key.
          - casual
          # Plain retained CSV artifacts; private repositories only, no hosted Pages dashboard.
          - plain
      publish_dashboard:
        description: "Run publish workflow after collection"
        type: boolean
        required: true
        default: true
      commit_readme:
        description: "Commit generated README output"
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  actions: read

env:
  RETENTION_DAYS: "90"

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.TRAFFIC_TOKEN || github.token }}

      - name: Resolve setup modes
        env:
          PRIVACY_INPUT: ${{ inputs.privacy_mode }}
          PUBLISH_INPUT: ${{ inputs.publish_dashboard }}
          COMMIT_README_INPUT: ${{ inputs.commit_readme }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail

          case "$PRIVACY_INPUT" in
            strong|casual|plain)
              privacy_mode="$PRIVACY_INPUT"
              ;;
            *)
              echo "Unsupported privacy_mode input: $PRIVACY_INPUT" >&2
              exit 1
              ;;
          esac

          if [ "$privacy_mode" = "plain" ] && [ "$REPOSITORY_PRIVATE" = "false" ]; then
            {
              echo "## Setup stopped"
              echo
              echo "\`privacy_mode=plain\` is only supported for private repositories."
              echo "Use \`strong\` or \`casual\` for public repositories."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          publish_workflow="disabled"
          pages_publication="disabled"
          if [ "$PUBLISH_INPUT" = "true" ]; then
            publish_workflow="enabled"
            if [ "$privacy_mode" != "plain" ]; then
              pages_publication="enabled"
            fi
          fi

          {
            echo "PRIVACY_MODE=$privacy_mode"
            echo "PUBLISH_WORKFLOW=$publish_workflow"
            echo "PAGES_PUBLICATION=$pages_publication"
            echo "COMMIT_OUTPUTS=$COMMIT_README_INPUT"
          } >> "$GITHUB_ENV"

      - name: Validate required secrets
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          TRAFFIC_DASHBOARD_SECRET: ${{ secrets.TRAFFIC_DASHBOARD_SECRET }}
          TRAFFIC_DASHBOARD_NEXT_SECRET: ${{ secrets.TRAFFIC_DASHBOARD_NEXT_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${TRAFFIC_TOKEN:-}" ]; then
            {
              echo "## Setup stopped"
              echo
              echo "Create a repository secret named \`TRAFFIC_TOKEN\`, then run setup again."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if ! GH_TOKEN="$TRAFFIC_TOKEN" gh api rate_limit >/dev/null 2>&1; then
            {
              echo "## Setup stopped"
              echo
              echo "\`TRAFFIC_TOKEN\` did not authenticate with the GitHub API."
              echo "Check the token value and repository permissions, then run setup again."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ -n "${TRAFFIC_DASHBOARD_NEXT_SECRET:-}" ]; then
            {
              echo "## Setup stopped"
              echo
              echo "\`TRAFFIC_DASHBOARD_NEXT_SECRET\` is still set."
              echo "Finish key rotation by replacing \`TRAFFIC_DASHBOARD_SECRET\`"
              echo "with the new key, then delete \`TRAFFIC_DASHBOARD_NEXT_SECRET\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$PRIVACY_MODE" = "strong" ] || [ "$PRIVACY_MODE" = "casual" ]; then
            if [ -z "${TRAFFIC_DASHBOARD_SECRET:-}" ]; then
              {
                echo "## Setup stopped"
                echo
                echo "\`privacy_mode=$PRIVACY_MODE\` needs a repository secret named \`TRAFFIC_DASHBOARD_SECRET\`."
                echo
                echo "See \`docs/SECURE_DASHBOARD_KEY.md\` for key generation options."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            if [ "${#TRAFFIC_DASHBOARD_SECRET}" -lt 40 ] && [ "$PRIVACY_MODE" = "strong" ]; then
              {
                echo "## Setup stopped"
                echo
                echo "\`TRAFFIC_DASHBOARD_SECRET\` is too short for \`privacy_mode=strong\`."
                echo "Use a generated key of at least 40 characters."
                echo
                echo "Use \`privacy_mode=casual\` only if you explicitly accept"
                echo "the weak-secret and offline brute-force risk."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            if [ "${#TRAFFIC_DASHBOARD_SECRET}" -lt 40 ] && [ "$PRIVACY_MODE" = "casual" ]; then
              {
                echo "## Casual privacy mode selected"
                echo
                echo "\`privacy_mode=casual\` encrypts artifacts and hosted dashboard output,"
                echo "but it is not intended to resist targeted offline guessing."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Enable and configure workflows
        run: |
          set -euo pipefail

          enable_workflow() {
            local workflow="$1"
            local disabled_workflow="$1.disabled"

            if [ -f "$disabled_workflow" ]; then
              mv "$disabled_workflow" "$workflow"
            elif [ ! -f "$workflow" ]; then
              echo "Could not find $disabled_workflow or $workflow."
              exit 1
            fi
          }

          enable_workflow ".github/workflows/collect.yml"

          if [ "$PUBLISH_WORKFLOW" = "enabled" ]; then
            enable_workflow ".github/workflows/publish.yml"
          fi

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          workflow_values = {
              Path(".github/workflows/collect.yml"): {
                  "PRIVACY_MODE": os.environ["PRIVACY_MODE"],
                  "RETENTION_DAYS": os.environ["RETENTION_DAYS"],
              },
              Path(".github/workflows/publish.yml"): {
                  "PRIVACY_MODE": os.environ["PRIVACY_MODE"],
                  "RETENTION_DAYS": os.environ["RETENTION_DAYS"],
                  "COMMIT_OUTPUTS": os.environ["COMMIT_OUTPUTS"],
              },
          }

          for workflow, replacements in workflow_values.items():
              if not workflow.exists():
                  continue
              text = workflow.read_text(encoding="utf-8")
              for key, value in replacements.items():
                  text = re.sub(
                      rf'^  {key}: ".*"$',
                      f'  {key}: "{value}"',
                      text,
                      flags=re.MULTILINE,
                  )
              workflow.write_text(text, encoding="utf-8")
          PY

      - name: Configure GitHub Pages publication
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          set -euo pipefail

          pages_endpoint="repos/$GITHUB_REPOSITORY/pages"

          if [ "$PAGES_PUBLICATION" = "enabled" ]; then
            if GH_TOKEN="$TRAFFIC_TOKEN" gh api "$pages_endpoint" >/dev/null 2>&1; then
              if ! GH_TOKEN="$TRAFFIC_TOKEN" gh api \
                -X PUT \
                "$pages_endpoint" \
                -f "build_type=workflow" \
                >/dev/null; then
                {
                  echo "## Setup stopped"
                  echo
                  echo "Could not configure GitHub Pages for workflow deployment."
                  echo "\`TRAFFIC_TOKEN\` must be able to manage GitHub Pages settings."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
            elif ! GH_TOKEN="$TRAFFIC_TOKEN" gh api \
              -X POST \
              "$pages_endpoint" \
              -f "build_type=workflow" \
              >/dev/null; then
              {
                echo "## Setup stopped"
                echo
                echo "Could not enable GitHub Pages for workflow deployment."
                echo "\`TRAFFIC_TOKEN\` must be able to manage GitHub Pages settings."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            {
              echo "## GitHub Pages configured"
              echo
              echo "GitHub Pages will publish from the Reponomics publish workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            current_build_type="$(
              GH_TOKEN="$TRAFFIC_TOKEN" gh api "$pages_endpoint" \
                --jq '.build_type // ""' \
                2>/dev/null || true
            )"

            if [ "$current_build_type" = "workflow" ]; then
              if ! GH_TOKEN="$TRAFFIC_TOKEN" gh api -X DELETE "$pages_endpoint" >/dev/null; then
                {
                  echo "## Setup stopped"
                  echo
                  echo "Could not unpublish the existing GitHub Pages site."
                  echo "\`TRAFFIC_TOKEN\` must be able to manage GitHub Pages settings."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi

              {
                echo "## GitHub Pages unpublished"
                echo
                echo "The existing workflow-deployed Pages site was disabled."
              } >> "$GITHUB_STEP_SUMMARY"
            elif [ -n "$current_build_type" ]; then
              {
                echo "## GitHub Pages left unchanged"
                echo
                echo "A Pages site already exists, but it is not configured for workflow deployment."
                echo "Setup did not alter that separate Pages configuration."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Commit setup changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          git diff --cached --quiet || git commit -m "chore: set up Reponomics dashboard [skip ci]"
          git push
