name: Set up Reponomics dashboard

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      # Do you want a dashboard with SVG charts, tables,
      # Mermaid diagrams, etc. embedded in your README?
      readme_dashboard:
        description: "README dashboard"
        type: choice
        required: true
        default: disabled
        options:
          - disabled  # No
          - enabled   # Yes
      pages_dashboard:
        # Do you want a dynamic HTML dashboard hosted directly on the repo's
        # GitHub Pages site?
        description: "GitHub Pages HTML dashboard"
        type: choice
        required: true
        default: encrypted-and-published
        options:
          # Yes, and it should be encrypted so that only people with a password can access it
          - encrypted-and-published
          # Yes, and it does not need to be encrypted, I don't mind if anyone looks at it
          - plaintext-and-published
          # Yes, encrypt it but don't publish it to GitHub Pages
          - encrypted-but-NOT-published
          # Yes, and just commit it to the repo, don't encrypt it or publish it to Pages
          - plaintext-but-NOT-published
          # No, don't bother with the HTML dashboard at all, I don't need it
          - disabled
      allow_weak_dashboard_secret:
        # Encrypt the dashboard even if the password I set does not have
        # high entropy and the dashboard can be easily decrypted
        description: "Allow a weak dashboard secret for encrypted modes"
        type: boolean
        required: true
        default: false     # No, fail the workflow if the password is not complex enough

permissions:
  contents: write
  actions: read

env:
  RETENTION_DAYS: "90"

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.TRAFFIC_TOKEN || github.token }}

      - name: Resolve setup modes
        env:
          README_INPUT: ${{ inputs.readme_dashboard }}
          PAGES_INPUT: ${{ inputs.pages_dashboard }}
          ALLOW_WEAK_INPUT: ${{ inputs.allow_weak_dashboard_secret }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail

          case "$PAGES_INPUT" in
            encrypted-and-published)
              pages_mode="encrypted"
              pages_publication="enabled"
              artifact_mode="encrypted"
              ;;
            plaintext-and-published)
              pages_mode="plain"
              pages_publication="enabled"
              artifact_mode="plain"
              ;;
            encrypted-but-NOT-published)
              pages_mode="encrypted"
              pages_publication="disabled"
              artifact_mode="encrypted"
              ;;
            plaintext-but-NOT-published)
              pages_mode="plain"
              pages_publication="disabled"
              artifact_mode="plain"
              ;;
            disabled)
              pages_mode="disabled"
              pages_publication="disabled"
              if [ "$REPOSITORY_PRIVATE" = "false" ]; then
                artifact_mode="encrypted"
              else
                artifact_mode="plain"
              fi
              ;;
            encrypted)
              pages_mode="encrypted"
              pages_publication="enabled"
              artifact_mode="encrypted"
              ;;
            plain)
              pages_mode="plain"
              pages_publication="enabled"
              artifact_mode="plain"
              ;;
            *)
              echo "Unsupported pages_dashboard input: $PAGES_INPUT" >&2
              exit 1
              ;;
          esac

          {
            echo "README_DASHBOARD=$README_INPUT"
            echo "PAGES_DASHBOARD=$pages_mode"
            echo "PAGES_PUBLICATION=$pages_publication"
            echo "ARTIFACT_SECURITY_MODE=$artifact_mode"
            echo "ALLOW_WEAK_DASHBOARD_SECRET=$ALLOW_WEAK_INPUT"
          } >> "$GITHUB_ENV"

      - name: Validate required secrets
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          TRAFFIC_DASHBOARD_SECRET: ${{ secrets.TRAFFIC_DASHBOARD_SECRET }}
          TRAFFIC_DASHBOARD_NEXT_SECRET: ${{ secrets.TRAFFIC_DASHBOARD_NEXT_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${TRAFFIC_TOKEN:-}" ]; then
            {
              echo "## Setup stopped"
              echo
              echo "Create a repository secret named \`TRAFFIC_TOKEN\`, then run setup again."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if ! GH_TOKEN="$TRAFFIC_TOKEN" gh api rate_limit >/dev/null 2>&1; then
            {
              echo "## Setup stopped"
              echo
              echo "\`TRAFFIC_TOKEN\` did not authenticate with the GitHub API."
              echo "Check the token value and repository permissions, then run setup again."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ -n "${TRAFFIC_DASHBOARD_NEXT_SECRET:-}" ]; then
            {
              echo "## Setup stopped"
              echo
              echo "\`TRAFFIC_DASHBOARD_NEXT_SECRET\` is still set."
              echo "Finish key rotation by replacing \`TRAFFIC_DASHBOARD_SECRET\`"
              echo "with the new key, then delete \`TRAFFIC_DASHBOARD_NEXT_SECRET\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          needs_dashboard_secret="false"
          if [ "$PAGES_DASHBOARD" = "encrypted" ] || [ "$ARTIFACT_SECURITY_MODE" = "encrypted" ]; then
            needs_dashboard_secret="true"
          fi

          if [ "$needs_dashboard_secret" = "true" ]; then
            if [ -z "${TRAFFIC_DASHBOARD_SECRET:-}" ]; then
              {
                echo "## Setup stopped"
                echo
                echo "This setup needs a repository secret named \`TRAFFIC_DASHBOARD_SECRET\`."
                echo
                echo "See \`docs/SECURE_DASHBOARD_KEY.md\` for key generation options."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            if [ "${#TRAFFIC_DASHBOARD_SECRET}" -lt 40 ] && [ "$ALLOW_WEAK_DASHBOARD_SECRET" != "true" ]; then
              {
                echo "## Setup stopped"
                echo
                echo "\`TRAFFIC_DASHBOARD_SECRET\` is too short. Use a generated key of at least 40 characters."
                echo
                echo "To continue anyway, rerun setup with \`allow_weak_dashboard_secret=true\`."
                echo "In repositories with public read access, that override can itself"
                echo "advertise that encrypted traffic data may be easier to brute force."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            if [ "${#TRAFFIC_DASHBOARD_SECRET}" -lt 40 ]; then
              {
                echo "## Weak dashboard secret override enabled"
                echo
                echo "Setup will continue because \`allow_weak_dashboard_secret=true\`."
                echo "In repositories with public read access, the override and workflow"
                echo "logs may advertise that encrypted traffic data is easier to brute force."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Enable and configure workflows
        run: |
          set -euo pipefail

          enable_workflow() {
            local workflow="$1"
            local disabled_workflow="$1.disabled"

            if [ -f "$disabled_workflow" ]; then
              mv "$disabled_workflow" "$workflow"
            elif [ ! -f "$workflow" ]; then
              echo "Could not find $disabled_workflow or $workflow."
              exit 1
            fi
          }

          enable_workflow ".github/workflows/collect.yml"

          if [ "$README_DASHBOARD" != "disabled" ] || [ "$PAGES_DASHBOARD" != "disabled" ]; then
            enable_workflow ".github/workflows/publish.yml"
          fi

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          workflow_values = {
              Path(".github/workflows/collect.yml"): {
                  "ARTIFACT_SECURITY_MODE": os.environ["ARTIFACT_SECURITY_MODE"],
                  "RETENTION_DAYS": os.environ["RETENTION_DAYS"],
                  "ALLOW_WEAK_DASHBOARD_SECRET": os.environ["ALLOW_WEAK_DASHBOARD_SECRET"],
              },
              Path(".github/workflows/publish.yml"): {
                  "README_DASHBOARD": os.environ["README_DASHBOARD"],
                  "PAGES_DASHBOARD": os.environ["PAGES_DASHBOARD"],
                  "ARTIFACT_SECURITY_MODE": os.environ["ARTIFACT_SECURITY_MODE"],
                  "RETENTION_DAYS": os.environ["RETENTION_DAYS"],
                  "ALLOW_WEAK_DASHBOARD_SECRET": os.environ["ALLOW_WEAK_DASHBOARD_SECRET"],
              },
          }

          for workflow, replacements in workflow_values.items():
              if not workflow.exists():
                  continue
              text = workflow.read_text(encoding="utf-8")
              for key, value in replacements.items():
                  text = re.sub(
                      rf'^  {key}: ".*"$',
                      f'  {key}: "{value}"',
                      text,
                      flags=re.MULTILINE,
                  )
              workflow.write_text(text, encoding="utf-8")
          PY

      - name: Configure GitHub Pages publication
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          set -euo pipefail

          pages_endpoint="repos/$GITHUB_REPOSITORY/pages"

          if [ "$PAGES_PUBLICATION" = "enabled" ]; then
            if GH_TOKEN="$TRAFFIC_TOKEN" gh api "$pages_endpoint" >/dev/null 2>&1; then
              if ! GH_TOKEN="$TRAFFIC_TOKEN" gh api \
                -X PUT \
                "$pages_endpoint" \
                -f "build_type=workflow" \
                >/dev/null; then
                {
                  echo "## Setup stopped"
                  echo
                  echo "Could not configure GitHub Pages for workflow deployment."
                  echo "\`TRAFFIC_TOKEN\` must be able to manage GitHub Pages settings."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
            elif ! GH_TOKEN="$TRAFFIC_TOKEN" gh api \
              -X POST \
              "$pages_endpoint" \
              -f "build_type=workflow" \
              >/dev/null; then
              {
                echo "## Setup stopped"
                echo
                echo "Could not enable GitHub Pages for workflow deployment."
                echo "\`TRAFFIC_TOKEN\` must be able to manage GitHub Pages settings."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            {
              echo "## GitHub Pages configured"
              echo
              echo "GitHub Pages will publish from the Reponomics publish workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            current_build_type="$(
              GH_TOKEN="$TRAFFIC_TOKEN" gh api "$pages_endpoint" \
                --jq '.build_type // ""' \
                2>/dev/null || true
            )"

            if [ "$current_build_type" = "workflow" ]; then
              if ! GH_TOKEN="$TRAFFIC_TOKEN" gh api -X DELETE "$pages_endpoint" >/dev/null; then
                {
                  echo "## Setup stopped"
                  echo
                  echo "Could not unpublish the existing GitHub Pages site."
                  echo "\`TRAFFIC_TOKEN\` must be able to manage GitHub Pages settings."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi

              {
                echo "## GitHub Pages unpublished"
                echo
                echo "The existing workflow-deployed Pages site was disabled."
              } >> "$GITHUB_STEP_SUMMARY"
            elif [ -n "$current_build_type" ]; then
              {
                echo "## GitHub Pages left unchanged"
                echo
                echo "A Pages site already exists, but it is not configured for workflow deployment."
                echo "Setup did not alter that separate Pages configuration."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Commit setup changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          git diff --cached --quiet || git commit -m "chore: set up Reponomics dashboard [skip ci]"
          git push
