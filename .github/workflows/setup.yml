name: Set up Reponomics dashboard

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      privacy_mode:
        description: "Privacy mode"
        type: choice
        required: true
        default: strong
        options:
          # Encrypted artifacts and hosted dashboard; requires a generated high-entropy key.
          - strong
          # Encrypted artifacts and hosted dashboard; accepts any non-empty key.
          - casual
          # Plain retained CSV artifacts; private repositories only, no hosted Pages dashboard.
          - plain
      generate_html_dashboard:
        description: "Generate HTML dashboard after collection"
        type: boolean
        required: true
        default: false
      commit_readme_snapshot:
        description: "Commit generated README snapshot after collection"
        type: boolean
        required: true
        default: false

env:
  RETENTION_DAYS: "90"

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve setup modes
        env:
          PRIVACY_MODE: ${{ inputs.privacy_mode }}
          GENERATE_HTML_DASHBOARD: ${{ inputs.generate_html_dashboard }}
          COMMIT_README_SNAPSHOT: ${{ inputs.commit_readme_snapshot }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail

          case "$PRIVACY_MODE" in
            strong|casual|plain)
              privacy_mode="$PRIVACY_MODE"
              ;;
            *)
              echo "Unsupported privacy_mode input: $PRIVACY_MODE" >&2
              exit 1
              ;;
          esac

          if [ "$privacy_mode" = "plain" ] && [ "$REPOSITORY_PRIVATE" = "false" ]; then
            {
              echo "## Setup stopped"
              echo
              echo "\`privacy_mode=plain\` is only supported for private repositories."
              echo "Use \`strong\` or \`casual\` for public repositories."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          publish_workflow="disabled"
          if [ "$GENERATE_HTML_DASHBOARD" = "true" ]; then
            publish_workflow="enabled"
          fi

          {
            echo "PRIVACY_MODE=$privacy_mode"
            echo "PUBLISH_WORKFLOW=$publish_workflow"
            echo "COMMIT_OUTPUTS=$COMMIT_README_SNAPSHOT"
          } >> "$GITHUB_ENV"

      - name: Validate required secrets
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          TRAFFIC_DASHBOARD_SECRET: ${{ secrets.TRAFFIC_DASHBOARD_SECRET }}
        run: |
          set -euo pipefail

          token_url="https://github.com/settings/personal-access-tokens/new?name=Reponomics%20Traffic%20Token&description=Read%20repository%20traffic%20for%20Reponomics%20Dashboard&target_name=$GITHUB_REPOSITORY_OWNER&expires_in=366&administration=read"
          key_doc_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/SECURE_DASHBOARD_KEY.md"
          privacy_matrix_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/architecture/PRIVACY_CONFIGURATION_MATRIX.md"

          if [ -z "${TRAFFIC_TOKEN:-}" ]; then
            {
              echo "## Setup stopped"
              echo
              echo "[Create a fine-grained personal access token]($token_url)"
              echo "with repository \`Administration: read\` for \`$GITHUB_REPOSITORY_OWNER\`."
              echo "Choose **All repositories** for broad automatic discovery, or"
              echo "**Only selected repositories** if you want to limit collection."
              echo "If you choose selected repositories, keep \`config.yaml\` within"
              echo "that token's repository access."
              echo "Then save the token as repository secret \`TRAFFIC_TOKEN\` and run setup again."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if ! GH_TOKEN="$TRAFFIC_TOKEN" gh api rate_limit >/dev/null 2>&1; then
            {
              echo "## Setup stopped"
              echo
              echo "\`TRAFFIC_TOKEN\` did not authenticate with the GitHub API."
              echo "Check the token value and repository permissions, then run setup again."
              echo
              echo "If the token expired or has the wrong permissions,"
              echo "[create a replacement fine-grained personal access token]($token_url)"
              echo "with repository \`Administration: read\` for the repositories"
              echo "this dashboard collects."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$PRIVACY_MODE" = "strong" ] || [ "$PRIVACY_MODE" = "casual" ]; then
            if [ -z "${TRAFFIC_DASHBOARD_SECRET:-}" ]; then
              {
                echo "## Setup stopped"
                echo
                echo "\`privacy_mode=$PRIVACY_MODE\` needs a repository secret named \`TRAFFIC_DASHBOARD_SECRET\`."
                echo
                echo "See [Secure Dashboard Key]($key_doc_url) for key generation options."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            if [ "${#TRAFFIC_DASHBOARD_SECRET}" -lt 40 ] && [ "$PRIVACY_MODE" = "strong" ]; then
              {
                echo "## Setup stopped"
                echo
                echo "\`TRAFFIC_DASHBOARD_SECRET\` is not strong enough for \`privacy_mode=strong\`."
                echo "Please generate a strong password following one of the methods described [here]($key_doc_url)."
                echo
                echo "Use \`privacy_mode=casual\` only if you explicitly accept"
                echo "the risk of a targeted brute-force attack. See [here]($privacy_matrix_url) for more detail."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

      - name: Enable and configure workflows
        run: |
          set -euo pipefail

          enable_workflow() {
            local workflow="$1"
            local disabled_workflow="$1.disabled"

            if [ -f "$disabled_workflow" ]; then
              mv "$disabled_workflow" "$workflow"
            elif [ ! -f "$workflow" ]; then
              echo "Could not find $disabled_workflow or $workflow."
              exit 1
            fi
          }

          enable_workflow ".github/workflows/collect.yml"
          enable_workflow ".github/workflows/incident-sentinel.yml"

          if [ "$PUBLISH_WORKFLOW" = "enabled" ]; then
            enable_workflow ".github/workflows/publish.yml"
          fi

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          workflow_values = {
              Path(".github/workflows/collect.yml"): {
                  "PRIVACY_MODE": os.environ["PRIVACY_MODE"],
                  "RETENTION_DAYS": os.environ["RETENTION_DAYS"],
              },
              Path(".github/workflows/incident-sentinel.yml"): {
                  "OUTAGE_RETENTION_DAYS": os.environ["RETENTION_DAYS"],
              },
              Path(".github/workflows/publish.yml"): {
                  "PRIVACY_MODE": os.environ["PRIVACY_MODE"],
                  "RETENTION_DAYS": os.environ["RETENTION_DAYS"],
                  "COMMIT_OUTPUTS": os.environ["COMMIT_OUTPUTS"],
              },
          }

          for workflow, replacements in workflow_values.items():
              if not workflow.exists():
                  continue
              text = workflow.read_text(encoding="utf-8")
              for key, value in replacements.items():
                  text = re.sub(
                      rf'^  {key}: ".*"$',
                      f'  {key}: "{value}"',
                      text,
                      flags=re.MULTILINE,
                  )
              workflow.write_text(text, encoding="utf-8")
          PY

      - name: Summarize setup
        run: |
          set -euo pipefail

          {
            echo "## Reponomics setup configured"
            echo
            echo "- Collection workflow: enabled"
            echo "- Incident sentinel workflow: enabled"
            echo "- Publish workflow: $PUBLISH_WORKFLOW"
            echo "- Privacy mode: \`$PRIVACY_MODE\`"
            echo "- README commits: \`$COMMIT_OUTPUTS\`"
            echo "- Artifact retention: \`$RETENTION_DAYS\` day(s)"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$PUBLISH_WORKFLOW" = "enabled" ] && [ "$PRIVACY_MODE" != "plain" ]; then
            {
              echo
              echo "## Manual GitHub Pages step"
              echo
              echo "To host the encrypted dashboard, open this repository's"
              echo "**Settings -> Pages** page and set **Build and deployment -> Source**"
              echo "to **GitHub Actions**. Do not grant Pages or Administration write"
              echo "permissions to \`TRAFFIC_TOKEN\` for this setup step."
              echo
              echo "If GitHub suggests Pages workflow templates, skip them."
              echo "The Reponomics publish workflow already uploads and deploys"
              echo "the Pages artifact, and verifies this existing Pages setting"
              echo "during deployment."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit setup changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          git diff --cached --quiet || git commit -m "chore: set up Reponomics dashboard [skip ci]"
          git push
