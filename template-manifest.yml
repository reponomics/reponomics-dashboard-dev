version: 1

description: >
  Files copied into the generated Reponomics dashboard template repository.
  Anything not listed here is maintainer, demo, cache, or internal source
  material.

include:
  - source: template/.github/ISSUE_TEMPLATE/config.yml
    target: .github/ISSUE_TEMPLATE/config.yml
  - source: template/.github/workflows/collect.yml
    target: .github/workflows/collect.yml.disabled
  - source: template/.github/workflows/incident-sentinel.yml
    target: .github/workflows/incident-sentinel.yml.disabled
  - source: template/.github/workflows/keepalive.yml
    target: .github/workflows/keepalive.yml.disabled
  - source: template/.github/workflows/publish.yml
    target: .github/workflows/publish.yml.disabled
  - source: template/.github/workflows/rotate-key.yml
    target: .github/workflows/rotate-key.yml
  - source: template/.github/workflows/setup.yml
    target: .github/workflows/setup.yml
  - source: template/.github/workflows/README.md
    target: .github/workflows/README.md
  - .gitignore
  - source: template/CODE_OF_CONDUCT.md
    target: CODE_OF_CONDUCT.md
  - source: template/CONTRIBUTING.md
    target: CONTRIBUTING.md
  - LICENSE
  - source: template/README.md
    target: README.md
  - source: template/SECURITY.md
    target: SECURITY.md
  - source: template/SUPPORT.md
    target: SUPPORT.md
  - config.yaml
  - config.example.yaml
  - source: template/docs/reponomics/FAQ.md
    target: docs/reponomics/FAQ.md
  - source: template/docs/reponomics/PRIVACY_CONFIGURATION_MATRIX.md
    target: docs/reponomics/PRIVACY_CONFIGURATION_MATRIX.md
  - source: template/docs/reponomics/PROVENANCE.md
    target: docs/reponomics/PROVENANCE.md
  - source: template/docs/reponomics/README.md
    target: docs/reponomics/README.md
  - source: template/docs/reponomics/SECURE_DASHBOARD_KEY.md
    target: docs/reponomics/SECURE_DASHBOARD_KEY.md
  - source: template/docs/reponomics/TRUST_BOUNDARY.md
    target: docs/reponomics/TRUST_BOUNDARY.md

forbidden:
  - .github/workflows/dev-*.yml
  - AGENTS.md
  - __INTERNAL__
  - Makefile
  - data
  - demo-data
  - dist
  - docs/BRANCH_MODEL.md
  - docs/GENERATED_REPOSITORY_MODEL.md
  - docs/LAUNCH_CHECKLIST.md
  - docs/REPOSITORY_POLICY.md
  - docs/adr
  - docs/architecture
  - docs/archive
  - docs/privacy-model-explainer.html
  - maintainer.mk
  - requirements.txt
  - requirements-dev.txt
  - scripts
  - template
  - template-action-release.yml
  - template-manifest.yml
  - tests
  - vendor
  - venv
